    <!-- GERADO pelo build a partir de mls-102033/l2/shared/litRuntime.json (scripts/litRuntime.mjs).
         Nao editar a mao: e este mapa que faz o mundo empacotado (dist/web, esbuild com
         lit external) e o mundo cru (obj/compiled.zip) carregarem O MESMO Lit. Um mapa
         vazio aqui no fonte e proposital — se a injecao falhar, a pagina falha alto em vez
         de cair de volta num CDN. -->
    <!-- collab:lit-importmap -->
    <script type="importmap">
      { "imports": {} }
    </script>
    <!-- /collab:lit-importmap -->
    <!-- Frontend error capture (window.onerror/unhandledrejection -> telemetry queue ->
         piggybacks on the next BFF call). Loaded FIRST so boot errors are captured too. -->
    <script type="module" src="/_102029_/l2/telemetry.js"></script>
    <!-- Early studio bootstrap: starts the SW install + cbe login in parallel with the
         app boot (module scripts run in document order — this executes before the body
         bootstrap; same module URL, so it runs only once). -->
    <script type="module" src="/_102033_/l2/cbe/cbeMiniCfe.js"></script>
